[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./deploy" }]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

# Robinhood Chain. Public RPCs are rate-limited; set an Alchemy key for real use.
[rpc_endpoints]
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC}"
robinhood_mainnet = "${ROBINHOOD_MAINNET_RPC}"

[etherscan]
robinhood_testnet = { key = "any", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630 }
robinhood_mainnet = { key = "any", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }
